name: Build WREAD APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract WREAD project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q wread.zip -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project: $ANDROID_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Repair Gradle Wrapper
        run: |
          cd "$ANDROID_DIR"

          mkdir -p gradle/wrapper

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing."
            echo "Downloading Gradle wrapper jar..."

            curl -L \
              -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x gradlew

          echo "Gradle wrapper files:"
          ls -la gradle/wrapper

      - name: Build Debug APK
        run: |
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find "$ANDROID_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WREAD-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
